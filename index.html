<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>卡通蛋糕 · Three.js</title>
<style>
  :root{
    --ink:#5a4450;
    --card:rgba(255,255,255,.74);
    --line:rgba(90,68,80,.14);
    --pink:#ff7fb0;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% 12%, #ffffff 0%, rgba(255,255,255,0) 62%),
      linear-gradient(170deg,#fff7fb 0%,#faf6ff 48%,#f2faff 100%);
    overflow:hidden;
  }
  #scene{ display:block; width:100vw; height:100vh; }

  .panel{
    position:fixed; left:20px; top:20px; z-index:5;
    background:var(--card);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:15px 17px 13px;
    box-shadow:0 12px 34px rgba(130,95,120,.15);
    max-width:min(92vw,330px);
  }
  .panel h1{ margin:0 0 2px; font-size:16px; letter-spacing:.5px; font-weight:800; }
  .panel .sub{ margin:0 0 12px; font-size:11.5px; opacity:.55; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  button{
    font:inherit; font-size:12.5px; font-weight:600;
    color:var(--ink); background:#fff;
    border:1px solid var(--line);
    border-radius:12px; padding:7px 12px; cursor:pointer;
    transition:transform .12s ease, box-shadow .18s ease, background .18s ease;
    user-select:none;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 6px 15px rgba(130,95,120,.16); }
  button:active{ transform:translateY(0); }
  button.on{ background:linear-gradient(135deg,#ffd6e7,#ffc4da); border-color:#ffb2ce; }
  .tag{ margin-top:11px; font-size:11.5px; opacity:.6; }
  .hint{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:5;
    font-size:12px; opacity:.5; background:var(--card);
    padding:6px 14px; border-radius:20px; border:1px solid var(--line); white-space:nowrap;
  }
  #loading{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; font-size:14px; background:rgba(255,255,255,.6);
    backdrop-filter:blur(5px); text-align:center; padding:24px; line-height:1.7;
  }
  #loading.hide{ display:none; }
  #loading code{ background:#fff; padding:2px 6px; border-radius:6px; border:1px solid var(--line); }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid rgba(255,127,176,.25); border-top-color:var(--pink);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (max-width:560px){
    .panel{ left:12px; top:12px; padding:11px 12px 10px; }
    .hint{ font-size:11px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="panel">
    <h1>🍰 卡通草莓蛋糕</h1>
    <p class="sub">Three.js · Toon Shading · 旋转曲面建模</p>
    <div class="row">
      <button id="btn-spin" class="on">自动旋转</button>
      <button id="btn-candle" class="on">吹灭蜡烛</button>
      <button id="btn-theme">换装</button>
      <button id="btn-reset">复位视角</button>
    </div>
    <div class="tag" id="theme-tag">当前配色：草莓奶油</div>
  </div>

  <div class="hint">拖拽旋转 · 滚轮/双指缩放</div>

  <div id="loading">
    <div class="spinner"></div>
    <div>正在加载 Three.js …</div>
  </div>

<script type="module">
/* ------------------------------------------------------------------
   卡通蛋糕 v3 · Three.js
   - 矮胖比例，旋转曲面（revolve）建模奶油 / 盘子 / 草莓
   - 4 段柔和梯度光照；海绵气孔贴图按周向加密，避免木纹感
------------------------------------------------------------------ */

const loadingEl = document.getElementById('loading');

const CDN_LIST = [
  'https://unpkg.com/three@0.169.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
  'https://esm.sh/three@0.169.0'
];
let THREE = null;
for (const url of CDN_LIST) {
  try { THREE = await import(url); break; }
  catch (err) { console.warn('[cake] 加载失败，换下一个源：', url, err); }
}
if (!THREE) {
  loadingEl.innerHTML =
    '<div style="font-size:30px">🍰</div>' +
    '<div><b>Three.js 没能从 CDN 加载成功</b></div>' +
    '<div style="font-size:12px;opacity:.7">请检查网络，或把 three.module.js 下载到本地后<br>把脚本顶部的 <code>CDN_LIST</code> 换成本地路径。</div>';
  throw new Error('three.js 加载失败');
}

/* ============================== 配色 ============================== */
const THEMES = [
  { name:'草莓奶油', sponge:0xffb3cc, jam:0xff4d6b, cream:0xfffaf8, berry:0xff3d5a,
    candle:0xff8fb3, stripe:0xffffff, sprinkles:[0xffd166,0x8ad7ff,0xff9ec7,0xffffff] },
  { name:'抹茶白巧', sponge:0xc3e88d, jam:0xff6f91, cream:0xf8fff4, berry:0xff6b5b,
    candle:0x8fd39a, stripe:0xf8fff5, sprinkles:[0xffd166,0x8fd39a,0xffffff,0xd7b98a] },
  { name:'香芋树莓', sponge:0xc9a5e8, jam:0xff7ab8, cream:0xfaf6ff, berry:0xd64550,
    candle:0xb98ce0, stripe:0xffffff, sprinkles:[0xffd166,0xffffff,0xc9a5e8,0x8ad7ff] },
  { name:'蓝莓星空', sponge:0xa9c0ff, jam:0x6b52d6, cream:0xf7f8ff, berry:0x6a63d8,
    candle:0x8fa8ff, stripe:0xffffff, sprinkles:[0xffd166,0xffffff,0xa9b6ff,0x8ad7ff] }
];
let themeIndex = 0;
const T = () => THEMES[themeIndex];

/* ============================== 渲染基础 ============================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

/* 4 段柔和卡通梯度（暗部不低于 0.38，避免脏灰阴影） */
function makeGradientMap(values) {
  const data = Uint8Array.from(values);
  const tex = new THREE.DataTexture(data, values.length, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const GRADIENT = makeGradientMap([158, 202, 236, 255]);
const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: 0x8f7580, side: THREE.BackSide });

function toon(color) { return new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT }); }

/* 描边：几何体须相对自身原点居中，否则缩放变位移 */
function outline(mesh, sxz = 1.03, sy = 1.006) {
  const o = new THREE.Mesh(mesh.geometry, OUTLINE_MAT);
  o.scale.set(sxz, sy, sxz);
  mesh.add(o);
  return mesh;
}

/* ============================== 程序化贴图 ============================== */
function spongeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1900; i++) {          // 气孔：小而密
    const x = Math.random() * 512, y = Math.random() * 512, r = 1.2 + Math.random() * 3.0;
    g.fillStyle = 'rgba(122,90,60,' + (0.05 + Math.random() * 0.10) + ')';
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 1.2 + Math.random() * 2.2;
    g.fillStyle = 'rgba(255,255,255,0.7)';
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10, 1);                      // 周向加密，气孔接近圆形
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function berryTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    g.save();
    g.translate(x, y); g.rotate(Math.random() * 3.14);
    g.fillStyle = 'rgba(70,30,34,' + (0.38 + Math.random() * 0.3) + ')';
    g.beginPath(); g.ellipse(0, 0, 3.6, 2.2, 0, 0, 6.2832); g.fill();
    g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================== 旋转曲面 ============================== */
/* profile: [[r, y], ...]，在 (r, y) 平面顺时针一圈，法线朝外；首尾闭合 */
function revolveSurface(profile, seg = 128, wave = null) {
  const n = profile.length;
  const pos = new Float32Array((seg + 1) * n * 3);
  const uv = new Float32Array((seg + 1) * n * 2);
  const idx = [];
  let p = 0, q = 0;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, th = t * Math.PI * 2;
    for (let j = 0; j < n; j++) {
      let r = profile[j][0], y = profile[j][1];
      if (wave) { const w = wave(th, r, j / (n - 1)); r += w[0]; y += w[1]; }
      pos[p++] = Math.cos(th) * r; pos[p++] = y; pos[p++] = Math.sin(th) * r;
      uv[q++] = t; uv[q++] = j / (n - 1);
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < n - 1; j++) {
      const a = i * n + j, b = (i + 1) * n + j, c = (i + 1) * n + j + 1, d = i * n + j + 1;
      idx.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function revolveMesh(profile, mat, seg, wave, oSxz, oSy) {
  const ys = profile.map(p => p[1]);
  const cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
  const local = profile.map(([r, y]) => [r, y - cy]);
  const m = new THREE.Mesh(revolveSurface(local, seg, wave), mat);
  m.position.y = cy;
  outline(m, oSxz, oSy);
  return m;
}

/* ============================== 材质 ============================== */
const MAT = {
  plate:    toon(0xffffff),
  sponge:   new THREE.MeshToonMaterial({ color: T().sponge, gradientMap: GRADIENT, map: spongeTexture() }),
  jam:      toon(T().jam),
  cream:    toon(T().cream),
  berry:    new THREE.MeshToonMaterial({ color: T().berry, gradientMap: GRADIENT, map: berryTexture() }),
  leaf:     toon(0x76c450),
  candle:   toon(T().candle),
  stripe:   toon(T().stripe),
  wick:     toon(0x3f2f38)
};
const sprinkleMats = [0, 1, 2, 3].map(i => toon(T().sprinkles[i]));

/* ============================== 灯光 ============================== */
/* 环境光只做"补一点底"，亮度交给主光：环境光过高会洗白、吃掉明暗层次 */
scene.add(new THREE.AmbientLight(0xffffff, 0.26));
scene.add(new THREE.HemisphereLight(0xffffff, 0xfff4f7, 0.28));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
keyLight.position.set(6, 9.5, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 34;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 13;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.022;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xfff4f6, 0.34);
fillLight.position.set(-7, 4, -5);
scene.add(fillLight);

const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.ShadowMaterial({ opacity: 0.09 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================== 蛋糕 ============================== */
const cake = new THREE.Group();
scene.add(cake);

/* --- 盘子：蕾丝波浪边 --- */
const plate = revolveMesh(
  [
    [0.001, 0.22], [1.40, 0.22], [2.45, 0.215], [2.78, 0.20], [2.95, 0.155], [3.03, 0.09],
    [3.00, 0.035], [2.78, 0.0], [2.20, -0.015], [1.20, -0.025], [0.001, -0.03],
    [0.001, 0.22]
  ],
  MAT.plate, 96,
  (th, r) => {
    const w = Math.max(0, (r - 2.35) / 0.65);
    return [0.07 * w * Math.cos(12 * th), 0.018 * w * Math.cos(12 * th)];
  },
  1.018, 1.02
);
plate.receiveShadow = true;
cake.add(plate);

/* --- 蛋糕胚（下胚 + 果酱 + 上胚）--- */
function spongeTier(rB, rT, yBase, h, jamH) {
  const g = new THREE.Group();
  const sH = (h - jamH) / 2;
  const mk = (rt, rb, hh, y) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, hh, 56, 1), MAT.sponge);
    m.position.y = y + hh / 2;
    outline(m, 1.022, 1.004);
    return m;
  };
  g.add(mk((rB + rT) / 2, rB, sH, yBase));
  const jr = ((rB + rT) / 2) * 1.004;
  const jam = new THREE.Mesh(new THREE.CylinderGeometry(jr, jr, jamH, 56, 1), MAT.jam);
  jam.position.y = yBase + sH + jamH / 2;
  outline(jam, 1.022, 1.06);
  g.add(jam);
  g.add(mk(rT, (rB + rT) / 2, sH, yBase + sH + jamH));
  return g;
}

cake.add(spongeTier(2.72, 2.66, 0.26, 1.16, 0.14));   // 下层 0.26 → 1.42
cake.add(spongeTier(1.98, 1.92, 1.38, 0.92, 0.12));   // 上层 1.38 → 2.30

/* --- 下层奶油裙（环形）--- */
cake.add(revolveMesh(
  [
    [2.36, 1.44], [2.56, 1.455], [2.72, 1.41], [2.79, 1.29], [2.75, 1.16], [2.66, 1.03],
    [2.59, 1.05], [2.58, 1.19], [2.56, 1.34], [2.46, 1.425], [2.36, 1.44]
  ],
  MAT.cream, 128,
  (th, r) => {
    const w = Math.max(0, (r - 2.5) / 0.35);
    return [0.035 * w * Math.cos(7 * th), 0.07 * w * Math.cos(7 * th + 0.6)];
  },
  1.024, 1.008
));

/* --- 顶部奶油盖 --- */
cake.add(revolveMesh(
  [
    [0.001, 2.60], [0.40, 2.59], [0.80, 2.555], [1.20, 2.485], [1.55, 2.365],
    [1.83, 2.245], [1.97, 2.125], [2.03, 1.985], [1.96, 1.94],
    [1.83, 1.965], [1.85, 2.10], [1.70, 2.24], [1.15, 2.34], [0.50, 2.40], [0.001, 2.41],
    [0.001, 2.60]
  ],
  MAT.cream, 128,
  (th, r) => {
    const w = Math.max(0, Math.min(1, (r - 1.3) / 0.6));
    return [0.045 * w * Math.cos(7 * th), 0.075 * w * Math.cos(7 * th + 0.6)];
  },
  1.022, 1.008
));

/* --- 奶油垂坠（水滴）--- */
function dripGroup(list) {
  const g = new THREE.Group();
  for (const [ang, R, yTop, len] of list) {
    const a = ang * Math.PI / 180;
    const rad = 0.08 + Math.random() * 0.03;
    const cap = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 4, 12), MAT.cream);
    cap.position.set(Math.cos(a) * R, yTop - len / 2 - rad * 0.5, Math.sin(a) * R);
    outline(cap, 1.05, 1.012);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(rad * 1.02, 12, 10), MAT.cream);
    tip.position.set(cap.position.x, yTop - len - rad * 0.5, cap.position.z);
    outline(tip, 1.06, 1.06);
    g.add(cap, tip);
  }
  return g;
}
cake.add(dripGroup([
  [12, 2.64, 1.24, 0.20], [78, 2.66, 1.22, 0.30], [140, 2.63, 1.26, 0.18],
  [205, 2.65, 1.23, 0.28], [268, 2.62, 1.25, 0.23], [322, 2.66, 1.24, 0.16]
]));
cake.add(dripGroup([
  [30, 1.96, 2.06, 0.20], [104, 1.98, 2.04, 0.30], [176, 1.95, 2.08, 0.18],
  [248, 1.97, 2.05, 0.27], [312, 1.96, 2.07, 0.22]
]));

/* ============================== 草莓 ============================== */
const BERRY_R = 0.30, BERRY_H = 0.60;
const BERRY_GEO = (() => {
  const pts = [];
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const u = -1 + 2 * (i / N);
    let r = Math.sqrt(Math.max(0, 1 - u * u));
    r *= (1 - 0.42 * Math.max(0, -u));
    pts.push(new THREE.Vector2(Math.max(0.0006, r * BERRY_R), (u + 1) * 0.5 * BERRY_H - BERRY_H / 2));
  }
  return new THREE.LatheGeometry(pts, 26);
})();
const LEAF_GEO = new THREE.SphereGeometry(1, 12, 9);

function makeBerry(s) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(BERRY_GEO, MAT.berry);
  body.scale.setScalar(s);
  outline(body, 1.055, 1.055);
  g.add(body);

  const topY = (BERRY_H / 2) * s;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.4;
    const leaf = new THREE.Mesh(LEAF_GEO, MAT.leaf);
    leaf.position.set(Math.cos(a) * 0.14 * s, topY + 0.035 * s, Math.sin(a) * 0.14 * s);
    leaf.scale.set(0.17 * s, 0.035 * s, 0.09 * s);
    leaf.rotation.y = -a;
    leaf.rotation.z = -0.32;
    g.add(leaf);
  }
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * s, 0.022 * s, 0.1 * s, 6), MAT.leaf);
  stem.position.y = topY + 0.06 * s;
  g.add(stem);
  return g;
}

/* 顶部：中央大草莓 + 一圈小草莓（外倾）。注意 group 原点是草莓几何中心 */
const berryMain = makeBerry(1.35);
berryMain.position.set(0, 2.74, 0);
cake.add(berryMain);

for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
  const b = makeBerry(0.66);
  const R = 1.56;
  b.position.set(Math.cos(a) * R, 2.44, Math.sin(a) * R);
  b.rotation.z = -Math.cos(a) * 0.30;
  b.rotation.x = Math.sin(a) * 0.30;
  cake.add(b);
}
/* 下层奶油裙上的一圈小草莓 */
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2 + 0.35;
  const b = makeBerry(0.55);
  const R = 2.50;
  b.position.set(Math.cos(a) * R, 1.50, Math.sin(a) * R);
  b.rotation.z = -Math.cos(a) * 0.22;
  b.rotation.x = Math.sin(a) * 0.22;
  cake.add(b);
}

/* --- 糖针 --- */
const SPRINKLE_GEO = new THREE.CapsuleGeometry(0.05, 0.1, 3, 8);
const sprinkles = new THREE.Group();
for (let i = 0; i < 30; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.25 + Math.random() * 1.35;
  const m = new THREE.Mesh(SPRINKLE_GEO, sprinkleMats[(Math.random() * sprinkleMats.length) | 0]);
  m.position.set(Math.cos(a) * r, 2.42 + (1.6 - r) * 0.13 + Math.random() * 0.04, Math.sin(a) * r);
  m.rotation.set(Math.random() * 3.14, Math.random() * 3.14, Math.random() * 3.14);
  sprinkles.add(m);
}
cake.add(sprinkles);

/* ============================== 蜡烛 ============================== */
const flames = [], flameLights = [];
const candleGroup = new THREE.Group();
candleGroup.position.y = 2.39;
cake.add(candleGroup);
const candleXZ = [[0, 0.92], [-0.80, -0.46], [0.80, -0.46]];

function flameGeometry(R, H) {
  const pts = [];
  const N = 18;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const r = R * Math.sin(Math.PI * Math.pow(t, 0.62)) * (1 - 0.22 * t);
    pts.push(new THREE.Vector2(Math.max(0.0006, r), t * H - H / 2));
  }
  return new THREE.LatheGeometry(pts, 16);
}

function makeCandle(x, z, phase) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.096, 0.92, 18, 1), MAT.candle);
  body.position.y = 0.46;
  outline(body, 1.06, 1.008);
  g.add(body);

  for (let i = 0; i < 4; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.091, 0.024, 6, 22), MAT.stripe);
    ring.rotation.x = Math.PI / 2;
    ring.rotation.y = 0.42;
    ring.position.y = 0.14 + i * 0.21;
    g.add(ring);
  }

  const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.085, 6), MAT.wick);
  wick.position.y = 0.96;
  g.add(wick);

  const flame = new THREE.Group();
  flame.position.y = 1.05;
  const outer = new THREE.Mesh(flameGeometry(0.098, 0.30), new THREE.MeshBasicMaterial({ color: 0xff8a3d }));
  const inner = new THREE.Mesh(flameGeometry(0.052, 0.19), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
  inner.position.y = -0.02;
  flame.add(outer, inner);
  flame.userData.phase = phase;
  g.add(flame);
  flames.push(flame);

  const pl = new THREE.PointLight(0xffb066, 0, 3.0, 2);
  pl.position.set(0, 1.16, 0);
  g.add(pl);
  flameLights.push(pl);
  return g;
}
candleXZ.forEach(([x, z], i) => candleGroup.add(makeCandle(x, z, i * 2.1)));

/* 阴影：描边不投影 */
cake.traverse(o => { if (o.isMesh && o.material !== OUTLINE_MAT) o.castShadow = true; });
plate.receiveShadow = true;

/* ============================== 飘浮彩纸 ============================== */
const confetti = new THREE.Group();
scene.add(confetti);
const confettiData = [];
const confettiColors = [0xff9ec7, 0xffd166, 0x8ad7ff, 0xb5a8ff, 0xffffff];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(0.2, 0.13),
    new THREE.MeshBasicMaterial({ color: confettiColors[i % confettiColors.length], side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
  );
  const a = Math.random() * Math.PI * 2, r = 4.4 + Math.random() * 4.5;
  m.position.set(Math.cos(a) * r, 0.8 + Math.random() * 6.0, Math.sin(a) * r);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  confetti.add(m);
  confettiData.push({ mesh: m, baseY: m.position.y, speed: 0.35 + Math.random() * 0.6, spin: (Math.random() - 0.5) * 1.1, phase: Math.random() * 6.283 });
}

/* ============================== 轨道控制器（手写） ============================== */
const ctrl = {
  target: new THREE.Vector3(0, 1.95, 0),
  theta: 0.62, phi: 1.06, radius: 11,
  tTheta: 0.62, tPhi: 1.06, tRadius: 11,
  autoRotate: true, dragging: false, lastX: 0, lastY: 0, pinch: 0
};
const PHI_MIN = 0.20, PHI_MAX = 1.46, R_MIN = 6.5, R_MAX = 26;
let userZoomed = false;

function fitRadius() {
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const needV = 3.05 / tanV;
  const needH = 3.5 / (tanV * Math.max(0.35, camera.aspect));
  return Math.min(R_MAX, Math.max(11.5, Math.max(needV, needH)));
}
function applyCamera() {
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * sp * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.radius * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);
}
applyCamera();
canvas.style.touchAction = 'none';

canvas.addEventListener('pointerdown', e => {
  ctrl.dragging = true; ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!ctrl.dragging) return;
  const dx = e.clientX - ctrl.lastX, dy = e.clientY - ctrl.lastY;
  ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
  ctrl.tTheta -= dx * 0.006;
  ctrl.tPhi = Math.min(PHI_MAX, Math.max(PHI_MIN, ctrl.tPhi - dy * 0.005));
});
const endDrag = e => { ctrl.dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault(); userZoomed = true;
  ctrl.tRadius = Math.min(R_MAX, Math.max(R_MIN, ctrl.tRadius * (1 + e.deltaY * 0.0011)));
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (ctrl.pinch) {
    userZoomed = true;
    ctrl.tRadius = Math.min(R_MAX, Math.max(R_MIN, ctrl.tRadius * (ctrl.pinch / d)));
  }
  ctrl.pinch = d;
}, { passive: true });
canvas.addEventListener('touchend', () => { ctrl.pinch = 0; });

/* ============================== UI ============================== */
const btnSpin = document.getElementById('btn-spin');
const btnCandle = document.getElementById('btn-candle');
const btnTheme = document.getElementById('btn-theme');
const btnReset = document.getElementById('btn-reset');
const themeTag = document.getElementById('theme-tag');

let candlesOn = true;
function setCandles(on) {
  candlesOn = on;
  flames.forEach(f => { f.visible = on; });
  btnCandle.textContent = on ? '吹灭蜡烛' : '点燃蜡烛';
  btnCandle.classList.toggle('on', on);
  if (!on) puffSmoke();
}
btnSpin.addEventListener('click', () => {
  ctrl.autoRotate = !ctrl.autoRotate;
  btnSpin.classList.toggle('on', ctrl.autoRotate);
});
btnCandle.addEventListener('click', () => setCandles(!candlesOn));
btnTheme.addEventListener('click', () => {
  themeIndex = (themeIndex + 1) % THEMES.length;
  const t = T();
  MAT.sponge.color.setHex(t.sponge);
  MAT.jam.color.setHex(t.jam);
  MAT.cream.color.setHex(t.cream);
  MAT.berry.color.setHex(t.berry);
  MAT.candle.color.setHex(t.candle);
  MAT.stripe.color.setHex(t.stripe);
  sprinkleMats.forEach((m, i) => m.color.setHex(t.sprinkles[i % t.sprinkles.length]));
  themeTag.textContent = '当前配色：' + t.name;
});
btnReset.addEventListener('click', () => {
  ctrl.tTheta = 0.62; ctrl.tPhi = 1.06; userZoomed = false; ctrl.tRadius = fitRadius();
});
setCandles(true);

/* ============================== 烟雾 ============================== */
const smokePool = [];
const smokeGeo = new THREE.SphereGeometry(1, 10, 8);
function puffSmoke() {
  for (const [x, z] of candleXZ) {
    for (let i = 0; i < 4; i++) {
      const m = new THREE.Mesh(smokeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));
      m.position.set(x, 3.68 + i * 0.12, z);
      m.scale.setScalar(0.06 + Math.random() * 0.05);
      scene.add(m);
      smokePool.push({ mesh: m, life: 0, delay: i * 0.12, drift: (Math.random() - 0.5) * 0.4 });
    }
  }
}

/* ============================== 主循环 ============================== */
const clock = new THREE.Clock();
let elapsed = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!userZoomed) { const d = fitRadius(); ctrl.radius = d; ctrl.tRadius = d; }
}
window.addEventListener('resize', resize);
resize();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (ctrl.autoRotate && !ctrl.dragging) ctrl.tTheta += dt * 0.28;
  ctrl.theta += (ctrl.tTheta - ctrl.theta) * Math.min(1, dt * 8);
  ctrl.phi += (ctrl.tPhi - ctrl.phi) * Math.min(1, dt * 8);
  ctrl.radius += (ctrl.tRadius - ctrl.radius) * Math.min(1, dt * 8);
  applyCamera();

  flames.forEach((f, i) => {
    if (!f.visible) { flameLights[i].intensity = 0; return; }
    const p = f.userData.phase;
    const s = 1 + Math.sin(elapsed * 11 + p) * 0.10 + Math.sin(elapsed * 23 + p * 2) * 0.04;
    f.scale.set(s, 1 + Math.sin(elapsed * 9 + p) * 0.13, s);
    f.rotation.z = Math.sin(elapsed * 6.5 + p) * 0.09;
    flameLights[i].intensity = 0.85 + Math.sin(elapsed * 13 + p) * 0.25;
  });

  cake.position.y = Math.sin(elapsed * 1.1) * 0.016;
  berryMain.rotation.y = Math.sin(elapsed * 0.9) * 0.1;

  confettiData.forEach(c => {
    c.mesh.position.y = c.baseY + Math.sin(elapsed * c.speed + c.phase) * 0.55;
    c.mesh.rotation.z += c.spin * dt;
    c.mesh.rotation.y += c.spin * dt * 0.7;
  });

  for (let i = smokePool.length - 1; i >= 0; i--) {
    const s = smokePool[i];
    s.life += dt;
    if (s.life < s.delay) continue;
    const t = s.life - s.delay;
    s.mesh.position.y += dt * 0.9;
    s.mesh.position.x += s.drift * dt;
    s.mesh.scale.setScalar(0.06 + t * 0.35);
    s.mesh.material.opacity = Math.max(0, 0.55 - t * 0.5);
    if (t > 1.1) {
      scene.remove(s.mesh);
      s.mesh.material.dispose();
      smokePool.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
loadingEl.classList.add('hide');
</script>
