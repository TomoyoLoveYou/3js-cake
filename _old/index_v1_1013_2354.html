<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>卡通蛋糕 · Three.js</title>
<style>
  :root{
    --ink:#4b3a4a;
    --card:rgba(255,255,255,.72);
    --line:rgba(75,58,74,.14);
    --pink:#ff7fb0;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,#ffe9f3 0%,#f3e9ff 45%,#e6f4ff 100%);
    overflow:hidden;
  }
  #scene{ display:block; width:100vw; height:100vh; }

  .panel{
    position:fixed; left:20px; top:20px; z-index:5;
    background:var(--card);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px 16px 12px;
    box-shadow:0 10px 30px rgba(120,90,120,.14);
    max-width:min(92vw,320px);
  }
  .panel h1{
    margin:0 0 2px; font-size:16px; letter-spacing:.5px; font-weight:800;
  }
  .panel .sub{ margin:0 0 12px; font-size:12px; opacity:.6; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  button{
    font:inherit; font-size:12.5px; font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:11px;
    padding:7px 12px;
    cursor:pointer;
    transition:transform .12s ease, background .18s ease, box-shadow .18s ease;
    user-select:none;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(120,90,120,.16); }
  button:active{ transform:translateY(0); }
  button.on{ background:linear-gradient(135deg,#ffd0e4,#ffc0d8); border-color:#ffb0cd; }
  .theme-tag{
    margin-top:10px; font-size:11.5px; opacity:.65;
  }
  .hint{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:5;
    font-size:12px; opacity:.55; background:var(--card);
    padding:6px 14px; border-radius:20px; border:1px solid var(--line);
    white-space:nowrap;
  }
  #loading{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; font-size:14px; background:rgba(255,255,255,.55);
    backdrop-filter:blur(4px); text-align:center; padding:24px; line-height:1.7;
  }
  #loading.hide{ display:none; }
  #loading code{ background:#fff; padding:2px 6px; border-radius:6px; border:1px solid var(--line); }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid rgba(255,127,176,.25); border-top-color:var(--pink);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (max-width:560px){
    .panel{ left:12px; top:12px; padding:11px 12px 10px; }
    .hint{ font-size:11px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="panel">
    <h1>🎂 卡通生日蛋糕</h1>
    <p class="sub">Three.js · Toon Shading · 手绘描边</p>
    <div class="row">
      <button id="btn-spin" class="on">自动旋转</button>
      <button id="btn-candle" class="on">点燃蜡烛</button>
      <button id="btn-theme">换装</button>
      <button id="btn-reset">复位视角</button>
    </div>
    <div class="theme-tag" id="theme-tag">当前配色：草莓恋人</div>
  </div>

  <div class="hint">拖拽旋转 · 滚轮/双指缩放</div>

  <div id="loading">
    <div class="spinner"></div>
    <div>正在加载 Three.js …</div>
  </div>

<script type="module">
/* ------------------------------------------------------------------
   卡通蛋糕 · Three.js
   1) three 主模块走多 CDN 兜底（不依赖 addons，控制器自己实现）
   2) 材质：MeshToonMaterial + 3 段梯度贴图 + 背面外扩描边
   3) 造型：盘子 / 双层海绵胚 + 果酱夹层 / 奶油云朵 + 垂坠 / 樱桃 / 蜡烛 + 火苗 / 糖针
------------------------------------------------------------------ */

const loadingEl = document.getElementById('loading');

const CDN_LIST = [
  'https://unpkg.com/three@0.169.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
  'https://esm.sh/three@0.169.0'
];

let THREE = null;
for (const url of CDN_LIST) {
  try { THREE = await import(url); break; }
  catch (err) { console.warn('[cake] 加载失败，尝试下一个源：', url, err); }
}
if (!THREE) {
  loadingEl.innerHTML =
    '<div style="font-size:30px">🍰</div>' +
    '<div><b>Three.js 没能从 CDN 加载成功</b></div>' +
    '<div style="font-size:12px;opacity:.7">请检查网络，或把 three.module.js 下载到本地后<br>把脚本顶部的 <code>CDN_LIST</code> 换成本地相对路径。</div>';
  throw new Error('three.js 加载失败');
}
loadingEl.classList.add('hide');

/* ============================== 配色主题 ============================== */
const THEMES = [
  { name:'草莓恋人', sponge:0xffe0b2, jam:0xff5f8d, frost:0xff9ec7, cream:0xfff2f7,
    candle:0xff77ae, stripe:0xffffff, sprinkles:[0xffd166,0x8ad7ff,0xffffff,0xff9ec7] },
  { name:'抹茶物语', sponge:0xf3e3c3, jam:0x9c6b3f, frost:0xa8d5a2, cream:0xf4fff1,
    candle:0x7fc8a9, stripe:0xf6fff0, sprinkles:[0xffd166,0xffffff,0xa8d5a2,0xd7b98a] },
  { name:'可可浓情', sponge:0xe6c49b, jam:0x6b3f2a, frost:0xc98d63, cream:0xffe8d2,
    candle:0x8b5e3c, stripe:0xfff1e0, sprinkles:[0xffffff,0xffd166,0xc98d63,0x9c6b3f] },
  { name:'蓝莓星空', sponge:0xefe4ff, jam:0x7b5cff, frost:0xa9b6ff, cream:0xeef1ff,
    candle:0x8f7bff, stripe:0xffffff, sprinkles:[0xffd166,0xffffff,0xa9b6ff,0x8ad7ff] }
];
let themeIndex = 0;
const T = () => THEMES[themeIndex];

/* ============================== 渲染基础 ============================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

/* --- 卡通梯度贴图（3 段硬边） --- */
function makeGradientMap(steps) {
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) data[i] = Math.round((i / (steps - 1)) * 255);
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const GRADIENT = makeGradientMap(3);

const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: 0x4b3a4a, side: THREE.BackSide });

function toon(color) {
  return new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT });
}

/* 共享几何体，减少 draw call 构建开销 */
const SPHERE = new THREE.SphereGeometry(1, 18, 14);
const SPRINKLE_GEO = new THREE.CapsuleGeometry(0.045, 0.09, 3, 8);

/* 给 mesh 挂一层背面外扩描边（作为子节点继承父变换） */
function outline(mesh, sx = 1.04, sy = 1.04, sz = 1.04) {
  const o = new THREE.Mesh(mesh.geometry, OUTLINE_MAT);
  o.scale.set(sx, sy, sz);
  mesh.add(o);
  return mesh;
}

function ball(mat, r, x, y, z, sy) {
  const m = new THREE.Mesh(SPHERE, mat);
  m.position.set(x, y, z);
  m.scale.set(r, sy === undefined ? r : sy, r);
  outline(m, 1.06, 1.06, 1.06);
  return m;
}

/* ============================== 灯光 ============================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.20));
scene.add(new THREE.HemisphereLight(0xfff4ff, 0xffd9e8, 0.25));

const keyLight = new THREE.DirectionalLight(0xffffff, 0.78);
keyLight.position.set(6, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 32;
keyLight.shadow.camera.left = -9;
keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffd9ec, 0.30);
fillLight.position.set(-7, 4, -5);
scene.add(fillLight);

/* ============================== 地面（只接阴影） ============================== */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.ShadowMaterial({ opacity: 0.17 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================== 材质池 ============================== */
const MAT = {
  plate:    toon(0xffffff),
  plateRim: toon(0xf4e6ee),
  sponge:   toon(T().sponge),
  jam:      toon(T().jam),
  frost:    toon(T().frost),
  cream:    toon(T().cream),
  candle:   toon(T().candle),
  stripe:   toon(T().stripe),
  cherry:   toon(0xff3b5c),
  stem:     toon(0x6aa84f),
  wick:     toon(0x3a2b34)
};
const sprinkleMats = [0,1,2,3].map(i => toon(T().sprinkles[i]));

/* ============================== 造型 ============================== */
const cake = new THREE.Group();
scene.add(cake);

/* --- 盘子 --- */
const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.45, 3.05, 0.3, 64), MAT.plate);
plate.position.y = 0.15;
plate.receiveShadow = true;
outline(plate, 1.02, 1.12, 1.02);
cake.add(plate);

const plateRim = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.13, 10, 72), MAT.plateRim);
plateRim.rotation.x = Math.PI / 2;
plateRim.position.y = 0.29;
outline(plateRim, 1.03, 1.03, 1.03);
cake.add(plateRim);

/* --- 一层海绵胚（下胚 + 果酱 + 上胚） --- */
function spongeTier(rBottom, rTop, yBase, h) {
  const g = new THREE.Group();
  const jamH = 0.15;
  const sH = (h - jamH) / 2;

  const a = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, sH, 48, 1), MAT.sponge);
  a.position.y = yBase + sH / 2;
  outline(a, 1.025, 1.01, 1.025);
  g.add(a);

  const jamR = (rTop + rBottom) / 2 * 1.005;
  const j = new THREE.Mesh(new THREE.CylinderGeometry(jamR, jamR, jamH, 48, 1), MAT.jam);
  j.position.y = yBase + sH + jamH / 2;
  outline(j, 1.025, 1.06, 1.025);
  g.add(j);

  const b = new THREE.Mesh(new THREE.CylinderGeometry(rTop * 0.995, rTop, sH, 48, 1), MAT.sponge);
  b.position.y = yBase + sH + jamH + sH / 2;
  outline(b, 1.025, 1.01, 1.025);
  g.add(b);

  return g;
}

/* --- 奶油云朵环（一圈球体堆叠） --- */
function creamRing(centerY, R, count, r, mat, jitter) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const rr = r * (0.80 + Math.random() * 0.34);
    const m = new THREE.Mesh(SPHERE, mat);
    m.position.set(
      Math.cos(a) * R,
      centerY + Math.sin(i * 2.3) * (jitter || 0.05),
      Math.sin(a) * R
    );
    m.scale.set(rr, rr * 0.86, rr);
    outline(m, 1.07, 1.07, 1.07);
    g.add(m);
  }
  return g;
}

/* --- 奶油垂坠（水滴状） --- */
function drips(centerY, R, count, mat) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.15;
    const len = 0.22 + Math.random() * 0.38;
    const rad = 0.11 + Math.random() * 0.04;
    const cap = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 4, 12), mat);
    cap.position.set(
      Math.cos(a) * (R - 0.06),
      centerY - len / 2 - rad * 0.6,
      Math.sin(a) * (R - 0.06)
    );
    outline(cap, 1.06, 1.02, 1.06);
    g.add(cap);
  }
  return g;
}

/* --- 糖针 --- */
function scatterSprinkles(countRings, rings) {
  const g = new THREE.Group();
  for (const spec of rings) {
    const { y, rMin, rMax, n } = spec;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = rMin + Math.random() * (rMax - rMin);
      const m = new THREE.Mesh(SPRINKLE_GEO, sprinkleMats[(Math.random() * sprinkleMats.length) | 0]);
      m.position.set(Math.cos(a) * r, y + Math.random() * 0.08, Math.sin(a) * r);
      m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      g.add(m);
    }
  }
  return g;
}

/* --- 樱桃 --- */
function makeCherry(scale) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(SPHERE, MAT.cherry);
  body.scale.setScalar(0.3 * scale);
  outline(body, 1.07, 1.07, 1.07);
  g.add(body);

  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.02, 0.24 * scale, 0),
    new THREE.Vector3(0.10 * scale, 0.52 * scale, 0.03),
    new THREE.Vector3(0.30 * scale, 0.70 * scale, -0.04)
  ]);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.022 * scale, 6, false), MAT.stem);
  g.add(stem);

  const leaf = new THREE.Mesh(SPHERE, MAT.stem);
  leaf.position.set(0.36 * scale, 0.74 * scale, -0.05);
  leaf.scale.set(0.16 * scale, 0.045 * scale, 0.085 * scale);
  leaf.rotation.z = 0.5;
  g.add(leaf);

  return g;
}

/* ============================== 蜡烛 ============================== */
const flames = [];       // 火苗 group
const flameLights = [];  // 火苗点光源
const candleGroup = new THREE.Group();

function makeCandle(x, z, phase) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.115, 1.0, 18, 1), MAT.candle);
  body.position.y = 0.5;
  outline(body, 1.06, 1.012, 1.06);
  g.add(body);

  for (let i = 0; i < 5; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.108, 0.026, 6, 22), MAT.stripe);
    ring.rotation.x = Math.PI / 2;
    ring.rotation.y = 0.42;
    ring.position.y = 0.14 + i * 0.19;
    g.add(ring);
  }

  const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.09, 6), MAT.wick);
  wick.position.y = 1.03;
  g.add(wick);

  /* 火苗：外焰 + 内焰，纯色不受光 */
  const flame = new THREE.Group();
  flame.position.y = 1.10;
  const outer = new THREE.Mesh(
    new THREE.ConeGeometry(0.105, 0.34, 14),
    new THREE.MeshBasicMaterial({ color: 0xff8a3d })
  );
  outer.position.y = 0.17;
  const inner = new THREE.Mesh(
    new THREE.ConeGeometry(0.055, 0.19, 12),
    new THREE.MeshBasicMaterial({ color: 0xffe066 })
  );
  inner.position.y = 0.12;
  flame.add(outer, inner);
  flame.userData.phase = phase;
  flame.userData.outer = outer;
  flame.userData.inner = inner;
  g.add(flame);
  flames.push(flame);

  const pl = new THREE.PointLight(0xffa64d, 0, 3.2, 2);
  pl.position.set(0, 1.28, 0);
  g.add(pl);
  flameLights.push(pl);

  return g;
}

/* ============================== 组装蛋糕 ============================== */
const Y = { plateTop: 0.30, tier1Base: 0.30, tier1Top: 1.70, tier2Base: 1.62, tier2Top: 2.62 };

cake.add(spongeTier(2.55, 2.48, Y.tier1Base, 1.40));
cake.add(creamRing(1.64, 2.42, 14, 0.31, MAT.frost, 0.05));
cake.add(drips(1.56, 2.44, 7, MAT.frost));

cake.add(spongeTier(1.82, 1.74, Y.tier2Base, 1.00));
cake.add(creamRing(2.56, 1.70, 11, 0.25, MAT.frost, 0.04));
cake.add(drips(2.50, 1.72, 5, MAT.frost));

/* 顶部奶油堆 */
const topCream = new THREE.Group();
const dome = new THREE.Mesh(SPHERE, MAT.cream);
dome.position.y = 2.72;
dome.scale.set(1.30, 0.42, 1.30);
outline(dome, 1.03, 1.06, 1.03);
topCream.add(dome);
topCream.add(creamRing(2.86, 0.85, 8, 0.30, MAT.cream, 0.04));
topCream.add(creamRing(2.66, 1.42, 12, 0.25, MAT.cream, 0.04));
cake.add(topCream);

/* 糖针 */
cake.add(scatterSprinkles(0, [
  { y: 3.06, rMin: 0.15, rMax: 1.15, n: 22 },
  { y: 2.62, rMin: 1.42, rMax: 1.72, n: 12 },
  { y: 1.74, rMin: 1.95, rMax: 2.62, n: 14 }
]));

/* 樱桃：中央 + 边上两颗 */
const cherryMain = makeCherry(1.0);
cherryMain.position.set(0, 3.20, 0);
cake.add(cherryMain);

const c2 = makeCherry(0.62); c2.position.set(1.58, 2.62, 0.88); c2.rotation.y = -0.8; cake.add(c2);
const c3 = makeCherry(0.55); c3.position.set(-1.52, 2.60, -0.98); c3.rotation.y = 1.4; cake.add(c3);

/* 蜡烛三支，围绕中心插在奶油上 */
candleGroup.position.y = 2.90;
cake.add(candleGroup);
const candlePos = [
  [0.78, 0.30], [-0.62, 0.62], [-0.30, -0.82]
];
candlePos.forEach(([x, z], i) => candleGroup.add(makeCandle(x, z, i * 2.1)));

/* 阴影：除描边外全部投影 */
cake.traverse(o => {
  if (o.isMesh && o.material !== OUTLINE_MAT) o.castShadow = true;
});
ground.receiveShadow = true;
plate.receiveShadow = true;

/* ============================== 氛围彩纸 ============================== */
const confetti = new THREE.Group();
scene.add(confetti);
const confettiData = [];
const confettiColors = [0xff9ec7, 0xffd166, 0x8ad7ff, 0xb5a8ff, 0xffffff];
for (let i = 0; i < 28; i++) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(0.22, 0.14),
    new THREE.MeshBasicMaterial({
      color: confettiColors[i % confettiColors.length],
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.9
    })
  );
  const a = Math.random() * Math.PI * 2;
  const r = 4.2 + Math.random() * 4.5;
  m.position.set(Math.cos(a) * r, 0.6 + Math.random() * 5.6, Math.sin(a) * r);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  confetti.add(m);
  confettiData.push({
    mesh: m,
    baseY: m.position.y,
    speed: 0.35 + Math.random() * 0.6,
    spin: (Math.random() - 0.5) * 1.2,
    phase: Math.random() * Math.PI * 2
  });
}

/* ============================== 极简轨道控制器 ============================== */
const ctrl = {
  target: new THREE.Vector3(0, 2.1, 0),
  theta: 0.62, phi: 1.12, radius: 11.5,
  tTheta: 0.62, tPhi: 1.12, tRadius: 11.5,
  autoRotate: true,
  dragging: false, lastX: 0, lastY: 0, pinch: 0
};
const PHI_MIN = 0.20, PHI_MAX = 1.48;
const R_MIN = 5.5, R_MAX = 24;
let userZoomed = false;

/* 按视口比例算一个能装下整只蛋糕的距离（竖屏自动拉远） */
function fitRadius() {
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const needV = 3.0 / tanV;
  const needH = 4.0 / (tanV * Math.max(0.35, camera.aspect));
  return Math.min(R_MAX, Math.max(9.5, Math.max(needV, needH)));
}

function applyCamera() {
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * sp * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.radius * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);
}
applyCamera();

canvas.style.touchAction = 'none';

canvas.addEventListener('pointerdown', e => {
  ctrl.dragging = true; ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!ctrl.dragging) return;
  const dx = e.clientX - ctrl.lastX, dy = e.clientY - ctrl.lastY;
  ctrl.lastX = e.clientX; ctrl.lastY = e.clientY;
  ctrl.tTheta -= dx * 0.006;
  ctrl.tPhi = Math.min(PHI_MAX, Math.max(PHI_MIN, ctrl.tPhi - dy * 0.005));
});
const endDrag = e => { ctrl.dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  userZoomed = true;
  ctrl.tRadius = Math.min(R_MAX, Math.max(R_MIN, ctrl.tRadius * (1 + e.deltaY * 0.0011)));
}, { passive: false });

/* 双指缩放 */
canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );
  if (ctrl.pinch) {
    userZoomed = true;
    ctrl.tRadius = Math.min(R_MAX, Math.max(R_MIN, ctrl.tRadius * (ctrl.pinch / d)));
  }
  ctrl.pinch = d;
}, { passive: true });
canvas.addEventListener('touchend', () => { ctrl.pinch = 0; });

/* ============================== UI ============================== */
const btnSpin = document.getElementById('btn-spin');
const btnCandle = document.getElementById('btn-candle');
const btnTheme = document.getElementById('btn-theme');
const btnReset = document.getElementById('btn-reset');
const themeTag = document.getElementById('theme-tag');

let candlesOn = true;

function setCandles(on) {
  candlesOn = on;
  flames.forEach(f => { f.visible = on; });
  btnCandle.textContent = on ? '吹灭蜡烛' : '点燃蜡烛';
  btnCandle.classList.toggle('on', on);
  if (!on) puffSmoke();
}

btnSpin.addEventListener('click', () => {
  ctrl.autoRotate = !ctrl.autoRotate;
  btnSpin.classList.toggle('on', ctrl.autoRotate);
});
btnCandle.addEventListener('click', () => setCandles(!candlesOn));
btnTheme.addEventListener('click', () => {
  themeIndex = (themeIndex + 1) % THEMES.length;
  const t = T();
  MAT.sponge.color.setHex(t.sponge);
  MAT.jam.color.setHex(t.jam);
  MAT.frost.color.setHex(t.frost);
  MAT.cream.color.setHex(t.cream);
  MAT.candle.color.setHex(t.candle);
  MAT.stripe.color.setHex(t.stripe);
  sprinkleMats.forEach((m, i) => m.color.setHex(t.sprinkles[i % t.sprinkles.length]));
  themeTag.textContent = '当前配色：' + t.name;
});
btnReset.addEventListener('click', () => {
  ctrl.tTheta = 0.62; ctrl.tPhi = 1.12;
  userZoomed = false;
  ctrl.tRadius = fitRadius();
});

/* 初始状态：蜡烛点着 */
setCandles(true);

/* ============================== 烟雾（吹灭瞬间） ============================== */
const smokePool = [];
const smokeGeo = new THREE.SphereGeometry(1, 10, 8);
function puffSmoke() {
  candlePos.forEach(([x, z]) => {
    for (let i = 0; i < 4; i++) {
      const m = new THREE.Mesh(smokeGeo, new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.55
      }));
      m.position.set(x, 4.05 + i * 0.12, z);
      m.scale.setScalar(0.06 + Math.random() * 0.05);
      scene.add(m);
      smokePool.push({ mesh: m, life: 0, delay: i * 0.12, drift: (Math.random() - 0.5) * 0.4 });
    }
  });
}

/* ============================== 主循环 ============================== */
const clock = new THREE.Clock();
let elapsed = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!userZoomed) {
    const d = fitRadius();
    ctrl.radius = d; ctrl.tRadius = d;
  }
}
window.addEventListener('resize', resize);
resize();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* 相机阻尼 */
  if (ctrl.autoRotate && !ctrl.dragging) ctrl.tTheta += dt * 0.28;
  ctrl.theta += (ctrl.tTheta - ctrl.theta) * Math.min(1, dt * 8);
  ctrl.phi += (ctrl.tPhi - ctrl.phi) * Math.min(1, dt * 8);
  ctrl.radius += (ctrl.tRadius - ctrl.radius) * Math.min(1, dt * 8);
  applyCamera();

  /* 火苗抖动 */
  flames.forEach((f, i) => {
    if (!f.visible) { flameLights[i].intensity = 0; return; }
    const p = f.userData.phase;
    const s = 1 + Math.sin(elapsed * 11 + p) * 0.10 + Math.sin(elapsed * 23 + p * 2) * 0.04;
    f.scale.set(s, 1 + Math.sin(elapsed * 9 + p) * 0.14, s);
    f.rotation.z = Math.sin(elapsed * 6.5 + p) * 0.10;
    f.position.x = Math.sin(elapsed * 7 + p) * 0.012;
    flameLights[i].intensity = 1.1 + Math.sin(elapsed * 13 + p) * 0.35;
  });

  /* 蛋糕轻微呼吸 + 顶部樱桃轻晃 */
  cake.position.y = Math.sin(elapsed * 1.1) * 0.018;
  cherryMain.rotation.y = Math.sin(elapsed * 0.9) * 0.12;

  /* 彩纸飘浮 */
  confettiData.forEach(c => {
    c.mesh.position.y = c.baseY + Math.sin(elapsed * c.speed + c.phase) * 0.55;
    c.mesh.rotation.z += c.spin * dt;
    c.mesh.rotation.y += c.spin * dt * 0.7;
  });

  /* 烟雾上升消散 */
  for (let i = smokePool.length - 1; i >= 0; i--) {
    const s = smokePool[i];
    s.life += dt;
    if (s.life < s.delay) continue;
    const t = s.life - s.delay;
    s.mesh.position.y += dt * 0.9;
    s.mesh.position.x += s.drift * dt;
    s.mesh.scale.setScalar(0.06 + t * 0.35);
    s.mesh.material.opacity = Math.max(0, 0.55 - t * 0.5);
    if (t > 1.1) {
      scene.remove(s.mesh);
      s.mesh.material.dispose();
      smokePool.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

/* 首帧渲染完成后再隐藏 loading，避免闪白 */
requestAnimationFrame(() => loadingEl.classList.add('hide'));
</script>
</body>
